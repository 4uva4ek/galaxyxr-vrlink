name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release zip
        shell: pwsh
        run: ./build/build-release.ps1
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSION $v does not match tag ${{ github.ref_name }}" }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galaxyxr-vrlink
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
      # Rolling release from main: one release per VERSION, re-uploaded (clobber) on
      # every later main push so `releases/latest` always serves the newest main build.
      # Native `gh` does not expand shell globs, so the dist files are enumerated here.
      - name: Publish rolling release (main push)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tag = "v$v"
          $sha = $env:GITHUB_SHA
          $notes = "Auto-built from main ($($sha.Substring(0,7)), $sha) - version $v"
          $assets = @(Get-ChildItem -Path dist -File |
              Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } |
              ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "no release artifacts in dist/" }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag --title $tag --notes $notes --target $sha
          }
          gh release upload $tag @assets --clobber
          Write-Host "published $tag"
